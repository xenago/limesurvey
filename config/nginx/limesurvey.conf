server {
    listen 80;
    root /var/www/html/limesurvey;
    index  index.php index.html index.htm;
    charset UTF-8;
    
    # Use the realip module to get the user IP address from the header set by the real external proxy
    # IMPORTANT: The below URL is used as an anchor for init.py, so keep it in place!
    # https://nginx.org/en/docs/http/ngx_http_realip_module.html
    # NOTE: the following variables are configured at runtime when the LS_PROXY_IP environment variable is set
    # set_real_ip_from 192.168.0.0/16;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    client_max_body_size 128M;

    # LimeSurvey 7 needs the "path" URL format for the question editor.
    # In that mode, Yii takes the route from the path and ignores the legacy ?r= parameter.
    # Old invitation links would land on the site root with the token dropped, ones like:
    # /index.php?r=survey/index&sid=543353&token=abcd&lang=en
    # So, redirect them to the path-format equivalent (/543353?...).
    # - Matched on $request_uri
    # - the original query string is passed through untouched
    # - 307 rather than 301/302: preserves the method and body
    if ($request_uri ~ "^/index\.php\?(?:.*&)?sid=(?<legacy_sid>\d+)") {
        return 307 /$legacy_sid$is_args$args;
    }

    location / {
        try_files $uri /index.php?$args;
    }

    # LimeSurvey: block direct web access to code and internal directories
    # https://www.limesurvey.org/manual/General_FAQ
    location ~ ^/(application|docs|framework|locale|protected|tests|themes/\w+/views) {
        deny all;
    }
    location ~ ^/tmp/runtime/ {
        deny all;
    }

    # Don't execute PHP from user-writable directories, and don't serve hidden dotfiles
    # (.htaccess, .env, .git, etc.; .well-known is allowed). Regex locations match in order.
    location ~* ^/(upload|tmp)/.*\.php$ {
        deny all;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ \.php$ {
         include snippets/fastcgi-php.conf;
         fastcgi_pass unix:/var/run/php/php-fpm.sock;
         fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
         include fastcgi_params;
    }

}
