[program:nginx]
directory = /usr/sbin
command = /usr/sbin/nginx -g "daemon off;"
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
killasgroup = false
stopasgroup = false
autostart = false
autorestart = true
startretries=5
startsecs = 0
stopwaitsecs = 15
