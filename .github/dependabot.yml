version: 2

# Notes:
# - LimeSurvey is fetched by URL in `Dockerfile`, which is not a configuration supported by Dependabot
# - The `update-limesurvey.yml` workflow handles LimeSurvey versions with `ls_version_detector.sh`
# - The LimeSurvey workflow runs before this and creates the required `dev` branch if missing

updates:

  # Base images referenced in the Dockerfile & docker-compose.yml
  - package-ecosystem: docker
    directory: /
    target-branch: "dev"
    schedule:
      interval: cron
      cronjob: "30 6 * * *"

  # Actions pinned in the workflows under .github/workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: "dev"
    schedule:
      interval: cron
      cronjob: "30 6 * * *"
