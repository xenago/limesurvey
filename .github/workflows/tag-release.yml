name: Tag release

# Tags main with the LimeSurvey version from the Dockerfile (if that tag doesn't exist yet), then starts the build.
# A tag created with GITHUB_TOKEN doesn't trigger build.yml, so this starts it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write  # needed to create the tag
      actions: write   # needed to start the build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'limesurvey\K[0-9]+(?:\.[0-9]+)+\+[0-9]+' Dockerfile)
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null; then
            echo "${version} is already tagged"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${version}" -f sha="${GITHUB_SHA}" >/dev/null
          gh workflow run build.yml --ref "${version}"
          echo "Tagged ${version} and started the build."
