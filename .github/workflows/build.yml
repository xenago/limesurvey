name: Build image

# Build and publish the multi-arch image
# - Pull requests into dev and manual runs perform builds and validate, but don't publish
# - A smoke test brings the stack up and waits for the container to report healthy
# - Publishing to the GitHub Container Registry @ ghcr.io happens only on a semver tag push to main:
#   each arch is built natively and pushed by digest, then merged into one multi-arch manifest

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'  # semver tags, e.g. 6.17.16 or 6.17.16+260814
  pull_request:
    branches: [dev]  # validate bump PRs into dev; main builds only on a tag
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# Cancel superseded PR/dispatch runs; never cancel an in-progress release (tag) run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Build each architecture on a native runner.
  # - On PRs and manual runs, build arm64 only since smoke covers amd64 by building via `docker compose --build`
  # - On a tag push, both amd64 and arm64 build natively and push by digest so the merge job can assemble a single manifest list
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ startsWith(github.ref, 'refs/tags/') && fromJSON('["linux/amd64","linux/arm64"]') || fromJSON('["linux/arm64"]') }}
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    permissions:
      contents: read
      packages: write  # push image blobs by digest (tag builds only)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # full history required for the on-main check before a push
        with:
          fetch-depth: 0

      - name: Prepare platform slug
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      # Don't push unless it is a tag on main
      - name: Verify the tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main; refusing to publish."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is contained in main."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Auto-derive OCI labels & per-arch manifest annotations from GitHub metadata and LimeSurvey's composer.json
      # Index-level annotations are applied separately in the `merge` job below
      - name: Docker labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later

      # PR / manual run: build the arch to confirm it compiles, without pushing.
      - name: Build (validate only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ steps.platform.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.slug }}

      - name: Log in to registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag push: build and push by digest (no tag applied yet)
      # oci-mediatypes=true is required for annotations to survive on the manifest through the digest-merge
      - name: Build and push by digest
        id: build
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.slug }}

      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Sanity check: bring the full stack up and wait for the LimeSurvey container to report
  # Docker healthy. Gates publishing (the merge job needs this).
  # On a tag push, this pulls and runs the exact amd64 image the build job just pushed by
  # digest.
  # PR/manual runs build locally instead.
  smoke:
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read  # pull the amd64 image by digest (tag builds only)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare env and config
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's|^MARIADB_PASSWORD=.*|MARIADB_PASSWORD=ci_db_pw|' .env
          sed -i 's|^MARIADB_ROOT_PASSWORD=.*|MARIADB_ROOT_PASSWORD=ci_root_pw|' .env
          sed -i 's|^LS_ADMIN_PASSWORD=.*|LS_ADMIN_PASSWORD=ci_admin_pw|' .env
          mkdir -p ./data/limesurvey
          cp examples/config.php ./data/limesurvey/config.php
          touch ./data/limesurvey/security.php
          # Match config.php's DB password to the CI value above (host/user/db already match the defaults)
          sed -i "s|'password' => 'CHANGEME'|'password' => 'ci_db_pw'|" ./data/limesurvey/config.php

      - name: Log in to registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the amd64 digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v8
        with:
          name: digests-linux-amd64
          path: ${{ runner.temp }}/digests

      # Pull the exact image the build job pushed and point compose at it via LIMESURVEY_IMAGE,
      # rather than building a third time
      - name: Pull the published amd64 image by digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          digest=$(ls "${RUNNER_TEMP}/digests")
          image="${REGISTRY}/${IMAGE_NAME}@sha256:${digest}"
          docker pull "$image"
          docker tag "$image" limesurvey-smoke:test
          echo "LIMESURVEY_IMAGE=limesurvey-smoke:test" >> .env

      - name: Start the stack (pulled image)
        if: startsWith(github.ref, 'refs/tags/')
        run: docker compose up -d

      - name: Start the stack (local build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: docker compose up -d --build

      - name: Wait for the limesurvey container to be healthy
        run: |
          set -euo pipefail
          # Stream container logs live alongside the polling output below; stop it once this step ends
          docker compose logs -f --no-color &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' limesurvey 2>/dev/null || echo missing)
            echo "[$i] limesurvey health: $status"
            if [ "$status" = healthy ]; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::limesurvey did not become healthy within the timeout."
          exit 1

      - name: Dump status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Assemble the per-arch digests into one manifest list, tag it, and publish the release.
  merge:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write  # Create the GitHub Release
      packages: write  # Publish to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags for the on-main and newest-version checks

      # A tag can point at any commit; only publish when it is contained in main.
      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main; refusing to publish."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is contained in main."

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Docker tags cannot contain "+", so the LimeSurvey build date suffix is mapped to "-"
      - name: Compute image tag from git tag
        id: imgtag
        run: echo "value=${GITHUB_REF_NAME//+/-}" >> "$GITHUB_OUTPUT"

      # Only move "latest" when this release is the highest version, so tagging an
      # older patch after a newer release does not roll latest backwards.
      - name: Determine if this is the newest release
        id: latest
        run: |
          set -euo pipefail
          highest=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$' | sort -V | tail -n 1 || true)
          if [ "$highest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      # Derive image tags and index-level annotations for the merged manifest list.
      # Index annotations are what GHCR reads to populate the package page description.
      # `licenses` is pinned as above (`build` job) to override GitHub misdetection.
      - name: Derive image tags and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}
            type=raw,value=${{ steps.imgtag.outputs.value }}
            type=sha
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Combine the per-arch digests into one tagged manifest list.
      # Index annotations (title, description, license etc) come from metadata-action
      # above and are what GHCR's package page reads to display the description
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          args=()
          # Tags
          while IFS= read -r t; do
            args+=(-t "$t")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # Annotations
          # metadata-action v6 doesn't propagate the `labels:` license override to annotations
          while IFS= read -r a; do
            [[ "$a" == *=GPL-2.0 ]] && a="${a}-or-later"
            args+=(--annotation "$a")
          done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # Per-arch digest refs
          # Filenames in this working dir are their sha256 hex
          for f in *; do
            args+=("${REGISTRY}/${IMAGE_NAME}@sha256:$f")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the published image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.imgtag.outputs.value }}

      # Build the changelog and release notes
      # The export reuses the amd64 build cache from above
      - name: Export the packaged changelog
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release-notes
          outputs: type=local,dest=${{ runner.temp }}/changelog
          cache-from: type=gha,scope=linux-amd64

      # Assemble the release text
      - name: Create release notes
        env:
          TAG: ${{ github.ref_name }}
          IMG_TAG: ${{ steps.imgtag.outputs.value }}
          IS_LATEST: ${{ steps.latest.outputs.is_latest }}
        run: |
          set -euo pipefail
          repo_name=${GITHUB_REPOSITORY##*/}
          image="${REGISTRY}/${GITHUB_REPOSITORY}"
          notes="${RUNNER_TEMP}/release-notes.md"
          # Slice the newest block out of the changelog exported from the build above (no download);
          # ls_release_notes.sh fails this step if it cannot produce the notes.
          changelog="${RUNNER_TEMP}/ls-changelog.txt"
          bash ls_release_notes.sh "${RUNNER_TEMP}/changelog/release_notes.txt" > "$changelog"
          {
            echo "Containerized LimeSurvey \`${TAG}\`."
            echo
            echo "## Container image"
            echo
            echo "Published to the [GitHub Container Registry](https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${repo_name})."
            echo
            echo '```'
            echo "docker pull ${image}:${IMG_TAG}"
            if [ "${IS_LATEST}" = "true" ]; then
              echo "docker pull ${image}:latest"
            fi
            echo '```'
            echo
            echo "Tags in this release:"
            echo
            echo "- \`${image}:${IMG_TAG}\`"
            if [ "${IS_LATEST}" = "true" ]; then
              echo "- \`${image}:latest\`"
            fi
            echo
            echo "## LimeSurvey release notes"
            echo
            echo "<details><summary>Changelog</summary>"
            echo
            echo '```'
            cat "$changelog"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Full LimeSurvey changelog: <https://github.com/LimeSurvey/LimeSurvey/blob/master/docs/release_notes.txt>"
          } > "$notes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: ${{ steps.latest.outputs.is_latest }}
