# Docker Compose stack for LimeSurvey. Configure via .env (see .env.example).
#
# See README.md for the full fresh-install and migration steps.
#
# By default on first start:
# 1. Pulls the prebuilt image
# 2. Stores data in ./data
# 3. Installs a fresh database
#
# To build the image locally , run `docker compose up -d --build`.
# To store data at a different path, set LS_DATA_DIR (e.g. keep data in a sibling directory).

name: limesurvey

services:

  limesurvey:
    # Pulls the prebuilt image by default
    # Override the tag with LIMESURVEY_IMAGE in .env, or build locally with `docker compose up -d --build`
    image: ${LIMESURVEY_IMAGE:-ghcr.io/xenago/limesurvey:latest}
    pull_policy: missing
    build: .
    container_name: limesurvey
    hostname: limesurvey
    restart: always
    depends_on:
      limesurvey-mariadb:
        condition: service_healthy
    env_file: .env
    ports:
      # Bind to localhost if proxy server is in the same compose network stack
      #- 127.0.0.1:80:80
      # Bind externally if proxy server is not on shared localhost
      - 80:80
    volumes:
      # Persistent data defaults to ./data beside this file; set LS_DATA_DIR to an absolute path
      - ${LS_DATA_DIR:-./data}/limesurvey/upload:/var/www/html/limesurvey/upload
      - ${LS_DATA_DIR:-./data}/limesurvey/config.php:/var/www/html/limesurvey/application/config/config.php
      - ${LS_DATA_DIR:-./data}/limesurvey/security.php:/var/www/html/limesurvey/application/config/security.php

  limesurvey-mariadb:
    # MariaDB LTS
    image: mariadb:12.3
    container_name: limesurvey-mariadb
    hostname: limesurvey-mariadb
    restart: always
    # MARIADB_DATABASE and MARIADB_USER are read from .env (they must match config.php).
    env_file: .env
    environment:
      # Fail fast if a password is unset in .env
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?copy .env.example to .env and set MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?copy .env.example to .env and set MARIADB_ROOT_PASSWORD}
      # Allows the healthcheck to connect
      MARIADB_MYSQL_LOCALHOST_USER: "1"
    volumes:
      - ${LS_DATA_DIR:-./data}/mariadb/mysql:/var/lib/mysql
    ports:
      # Bind to localhost only; the app reaches the DB over the compose network
      - 127.0.0.1:3306:3306
      # Bind externally if database must be accessed directly by an external system, e.g. for analytics
      # Be very careful if doing this!
      #- 3306:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
