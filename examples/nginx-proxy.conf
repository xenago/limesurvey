# Sample nginx reverse proxy to place in front of the LimeSurvey container.
#
# The container owns all LimeSurvey-specific routing and directory protection, so a proxy only
# needs to terminate TLS, forward requests, and pass the headers LimeSurvey relies on. The same
# headers apply if you adapt this to Apache, Caddy, Traefik, and so on.
#
# Replace surveys.example.com, the certificate paths, the upstream address, and the trusted
# CIDRs with your own values.

upstream limesurvey_backend {
    # Address of the container as reachable from the proxy (compose service name, or host:port)
    server    limesurvey:80;
    keepalive 8;
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name surveys.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name surveys.example.com;

    ssl_certificate     /etc/ssl/certs/surveys.example.com.crt;
    ssl_certificate_key /etc/ssl/private/surveys.example.com.key;

    # If another load balancer sits in front and sets X-Forwarded-For, recover the real client IP:
    #set_real_ip_from 10.0.0.0/8;
    #real_ip_header X-Forwarded-For;
    #real_ip_recursive on;

    # Security and hygiene headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_hide_header X-Powered-By;

    # Match the container and PHP upload limit; allow long imports/exports
    client_max_body_size 128M;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/javascript application/json application/xml font/ttf font/woff2 image/svg+xml text/css text/plain text/xml;

    # Forward the headers LimeSurvey needs (inherited by the location blocks below)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Optional: restrict the admin area to trusted networks.
    # LimeSurvey reaches admin via both path-style URLs (/admin, /index.php/admin, /index.php/surveyAdministration)
    # and query-style URLs (/index.php?r=admin..., ?r=surveyAdministration), so a path location alone is not enough.
    # The 406 -> @admin_only redirect below sends the query form through the same trusted-IP gate.
    # To enable: set your trusted CIDRs, then uncomment the two below error_page lines, the `if` inside location /,
    # and the two admin location blocks.
    #error_page 406 = @admin_only;
    #recursive_error_pages on;

    location / {
        #if ($arg_r ~* "^(admin|surveyAdministration)") { return 406; }
        proxy_pass http://limesurvey_backend;
    }

    #location ~ ^/(admin|index\.php/(admin|surveyAdministration)) {
    #    allow 10.0.0.0/8;
    #    allow 192.168.0.0/16;
    #    deny all;
    #    proxy_pass http://limesurvey_backend;
    #}
    #location @admin_only {
    #    allow 10.0.0.0/8;
    #    allow 192.168.0.0/16;
    #    deny all;
    #    proxy_pass http://limesurvey_backend;
    #}
}
